<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker</title>
</head>

<body>

    <!-- Aim: have multiple goals -->

    <h1>Add Goal</h1>

    <label for="goal_name">Goal Name</label>
    <input type="text" id="goal_name" name="goal_name">
    <br>

    <label for="goal_description">Description</label><br>
    <textarea id="goal_description" name="goal_description"></textarea>
    <br>
    <label for="goal_deadline">Deadline</label>
    <input type="date" id="goal_deadline" name="goal_deadline">
    <br>
    <label for="goal_why_it_matters">Why It Matters</label>
    <textarea id="goal_why_it_matters" name="goal_why_it_matters"></textarea>
    <br>
    <button type="button" onclick="send_goal_info()">Send Goal</button>
 


    <div id="goals_text_box"></div>


    <script>

        async function display_all_goals_stored() {
            const response = await fetch("/get_all_stored_goals");
            const data = await response.text();

            document.querySelector("#goals_text_box").innerHTML = data;
        }



        async function send_goal_info() {
            display_all_goals_stored();
            const goalName = document.querySelector("#goal_name").value;
            const description = document.querySelector("#goal_description").value;
            const deadline = document.querySelector("#goal_deadline").value;
            const whyItMatters = document.querySelector("#goal_why_it_matters").value;

            fetch("/sending_goal_details", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    goal_name: goalName,
                    description: description,
                    deadline: deadline,
                    why_it_matters: whyItMatters
                })

            })

            .then(response => response.text())

            .then(data => {

                document.querySelector("#goals_text_box").innerHTML += data;

            });

        }
        
        
        display_all_goals_stored();


        async function delete_goal(goal_id){
            await fetch("/remove_goal",{
            method:"POST",
            headers:{
                "Content-Type": "application/json"
            },
            body:JSON.stringify({"goal_id":goal_id})
            }
            
            )
            display_all_goals_stored();   
        }


    </script>

</body>
</html>
