<!DOCTYPE html>
<html>

<head>
    <title>Notes</title>
</head>

<body>

    <h1>My Notes</h1>

    <!-- Notes list -->
    <div id="notes-list">

        {% for note in notes %}

            <button class="note-button" data-id="{{ note[0] }}" data-title="{{ note[1] }}" data-content="{{ note[2] }}">{{ note[1] }}</button>

            <br><br>

        {% endfor %}

    </div>


    <!-- Create new note -->
    <button onclick="showNoteForm()">+ Create New Note</button>

    <div id="note-form" style="display: none;">

        <br>

        <form action="/create_note" method="POST">

            <input type="text" name="name_page" placeholder="Note title" required>

            <br><br>

            <textarea name="page_content" placeholder="Write your thoughts..." rows="20" cols="80"></textarea>

            <br><br>

            <button type="submit">Create Note</button>

        </form>

    </div>


    <!-- Edit selected note -->
    <div id="selected-note">

        <br>

        <form action="/update_note" method="POST">

            <input type="hidden" id="selected-id" name="note_id">

            <input type="text" id="selected-title" name="name_page" placeholder="Note title" required>

            <br><br>

            <textarea id="selected-content" name="page_content" placeholder="Write your thoughts..." rows="20" cols="80"></textarea>

            <br><br>

            <button type="submit">Save Changes</button>

        </form>

    </div>


    <script>

        function showNoteForm() {
            document.getElementById("note-form").style.display = "block";
        }


        const noteButtons = document.querySelectorAll(".note-button");


        noteButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                const id = button.dataset.id;
                const title = button.dataset.title;
                const content = button.dataset.content;

                document.querySelector("#selected-id").value = id;
                document.querySelector("#selected-title").value = title;
                document.querySelector("#selected-content").value = content;

            });

        });

    </script>

</body>

</html>
